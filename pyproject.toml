[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiny-reading-tracker"
version = "0.1.0"
description = "A tiny reading library: SQLite metadata, Zotero ingestion, Markdown notes."
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "httpx>=0.27,<1"]

[project.scripts]
lit = "tiny_reading_tracker.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
